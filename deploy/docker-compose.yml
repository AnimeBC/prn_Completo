# ============================================================
# coturn (TURN/STUN) para llamadas WebRTC nitidas.
# Ejecutar en el VPS:  docker compose -f deploy/docker-compose.yml up -d
# Requiere: una IP publica en EXTERNAL_IP y puertos abiertos.
# ============================================================
services:
  coturn:
    image: coturn/coturn:4.6
    container_name: pkp-coturn
    restart: unless-stopped
    network_mode: host
    command: >
      -n
      --log-file=stdout
      --min-port=49160
      --max-port=49200
      --realm=${TURN_REALM:-pikantepe}
      --server-name=${TURN_REALM:-pikantepe}
      --external-ip=${EXTERNAL_IP}
      --listening-port=3478
      --fingerprint
      --lt-cred-mech
      --user=${TURN_USERNAME:-pikantepe}:${TURN_CREDENTIAL:-cambia_esto}
      --no-cli
      --no-tls
      --no-dtls
      --stale-nonce=600
      --max-bps=1000000
      --bps-capacity=0
      --no-multicast-peers
      --denied-peer-ip=0.0.0.0-0.255.255.255
      --denied-peer-ip=10.0.0.0-10.255.255.255
      --denied-peer-ip=172.16.0.0-172.31.255.255
      --denied-peer-ip=192.168.0.0-192.168.255.255
      --allowed-peer-ip=127.0.0.1
